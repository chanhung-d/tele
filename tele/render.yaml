services:
  - type: web
    name: telegram-file-upload-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
      - key: UPLOAD_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
