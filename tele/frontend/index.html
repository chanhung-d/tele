<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Gửi file đến Telegram</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Trang chủ">
        <span class="brand-mark">↗</span>
        <span>FileDrop <small>TELEGRAM</small></span>
      </a>
      <span class="secure"><span class="dot"></span> Kết nối bảo mật</span>
    </header>

    <section class="hero">
      <div class="eyebrow">UPLOAD • SEND • DONE</div>
      <h1>Gửi file đến<br><span>Telegram</span></h1>
      <p>Tải file lên nhanh chóng và chuyển trực tiếp đến cuộc trò chuyện Telegram đã cấu hình.</p>
    </section>

    <section class="panel">
      <form id="uploadForm">
        <label class="field-label" for="password">Mật khẩu gửi file</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
               placeholder="Nhập mật khẩu được cấp" required>

        <label class="dropzone" id="dropzone" for="fileInput">
          <input id="fileInput" name="file" type="file" required>
          <span class="upload-icon">↑</span>
          <strong id="fileTitle">Chọn file để tải lên</strong>
          <span id="fileHint">Nhấn để chọn hoặc kéo thả file vào đây</span>
          <span class="limit">TỐI ĐA 50 MB / FILE</span>
        </label>

        <div class="file-meta" id="fileMeta" hidden>
          <span class="file-symbol">▤</span>
          <span class="file-details"><strong id="fileName"></strong><small id="fileSize"></small></span>
          <button type="button" class="remove" id="removeFile" aria-label="Bỏ file">×</button>
        </div>

        <div class="progress-wrap" id="progressWrap" hidden>
          <div class="progress-caption"><span id="progressText">Đang gửi...</span><span id="progressPercent">0%</span></div>
          <div class="progress-track"><div id="progressBar"></div></div>
        </div>

        <button class="submit" id="submitButton" type="submit">
          <span>Gửi file đến Telegram</span><span aria-hidden="true">→</span>
        </button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <footer>
      <span>File được chuyển qua máy chủ bảo mật.</span>
      <span>Không lưu trữ lâu dài trên website.</span>
    </footer>
  </main>
  <script src="./config.js"></script>
  <script src="./script.js"></script>
</body>
</html>
